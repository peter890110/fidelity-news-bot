<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080a0e"><title>AI 財經新聞分析助手</title>
<link rel="stylesheet" href="/style.css?v=market-3-copy">
</head>
<body>
<svg aria-hidden="true" class="icon-defs"><defs>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 2.8 7.2L22 12l-7.2 2.8L12 22l-2.8-7.2L2 12l7.2-2.8L12 2Z"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 10a8 8 0 1 0-1.4 7.2M20 4v6h-6"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/></symbol>
<symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7M21 3 10 14M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
</defs></svg>
<main class="shell">
<header class="masthead"><div><h1><svg><use href="#i-spark"/></svg><span>AI 財經新聞分析助手</span></h1><p>盤前／盤後最新市場脈動與核心財經訊號解碼</p></div><div class="source-status"><i></i><span>公開新聞來源</span></div></header>
<section class="controls" aria-label="新聞選擇條件">
<label for="range">時間跨度<select id="range"><option value="12">過去 12 小時</option><option value="24" selected>過去 24 小時（早盤與隔夜新聞）</option><option value="72">過去 3 天</option><option value="168">過去 7 天</option></select></label>
<label for="focus">選文條件<select id="focus"><option value="all">財經新聞・總體經濟優先</option><option value="通膨與利率">通膨與利率</option><option value="匯率與資金">匯率與資金</option><option value="經濟成長">台灣經濟成長</option><option value="全球景氣">全球景氣</option></select></label>
<button id="refresh" class="primary"><svg><use href="#i-refresh"/></svg><span>獲取最新財經解析</span></button>
</section>
<div class="report-heading"><div><h2>精選今日重大驅動新聞</h2><p id="updated">載入新聞報告…</p></div><button id="copy" class="secondary" disabled><svg><use href="#i-copy"/></svg><span>複製完整分析報告</span></button></div>
<nav class="section-nav" aria-label="報告區塊"><a href="#taiwan">台股盤後</a><a href="#us">美股盤後</a><a href="#economic">經濟日報 <b>02</b></a><a href="#commercial">工商時報 <b>02</b></a><span>每篇 3 點・每點 200–300 字</span></nav>
<p id="notice" class="notice" role="status" hidden></p>
<section id="taiwan" class="panel blue" aria-label="台股盤後"><div class="section-top"><h2 class="pill">台股盤後</h2><span class="session-date"></span></div><div class="market-content"></div></section>
<section id="us" class="panel green" aria-label="美股盤後"><div class="section-top"><h2 class="pill">美股盤後</h2><span class="session-date"></span></div><div class="market-content"></div></section>
<section id="economic" class="panel pink" aria-label="經濟日報"><div class="section-top"><h2 class="pill">經濟日報</h2><span>精選 2 篇</span></div><div class="articles" id="udn"></div></section>
<section id="commercial" class="panel gold" aria-label="工商時報"><div class="section-top"><h2 class="pill">工商時報</h2><span>精選 2 篇</span></div><div class="articles" id="ctee"></div></section>
<div id="filter-empty" class="filter-empty" hidden>這份報告目前沒有此主題的新聞，請選擇其他選文條件。</div>

<footer><p>盤後採前一個已收盤交易日，依台美各自交易日期更新。</p><p>財經新聞試作版</p></footer>
<dialog id="copy-dialog"><form method="dialog"><h2>複製文字</h2><p>文字已選取，請按 ⌘C 或 Ctrl+C 複製。</p><textarea id="copy-text" readonly aria-label="可複製的報告文字"></textarea><button class="secondary">關閉</button></form></dialog>
<div id="toast" role="status" hidden></div>
</main>
<script type="module" src="/app.js?v=market-3-copy"></script>
</body></html>
